# Gitea - self-hosted Git service (version control UI)
services:
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=192.168.106.132
      - GITEA__server__ROOT_URL=http://192.168.106.132:3000/
      - GITEA__server__SSH_DOMAIN=192.168.106.132
      - GITEA__server__SSH_PORT=2222
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"   # web UI
      - "2222:22"     # git over SSH
